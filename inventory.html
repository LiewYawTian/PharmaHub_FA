<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaHub - Inventory</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="js/general.js" defer></script>
    <script src="js/inventory.js" defer></script>
</head>
<body>

    <header>
        <h1>PharmaHub Inventory</h1>
        <p>System Time: <strong id="currentSystemClock">Loading...</strong></p>
    </header>

    <div class="user_bar">
        <span>Logged in as: <strong id="sidebarUsername">Administrator</strong></span>
        <button type="button" id="logoutBtn" class="logout_btn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
    </div>

    <nav>
        <a href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a class="active" href="inventory.html"><i class="fa-solid fa-pills"></i> Inventory</a>
        <a href="stock_In-Out.html"><i class="fa-solid fa-right-left"></i> Stock In/Out</a>
        <a href="deliveries.html"><i class="fa-solid fa-truck"></i> Deliveries</a>
        <a href="batches_expiryTracker.html"><i class="fa-solid fa-calendar-days"></i> Batch & Expiry</a>
        <a href="reports.html"><i class="fa-solid fa-file-invoice-dollar"></i> Reports</a>
    </nav>

    <main>
        <!-- Search and Filter Section -->
        <fieldset>
            <legend>Search & Filter</legend>
            <label for="searchMedInput">Search Medicine:</label>
            <input type="text" id="searchMedInput" placeholder="Search by using Medicine Name or Medicine ID...">
            <button type="button" id="searchMedBtn">Search <i class="fas fa-search"></i></button>
            <button type="button" id="resetFilterBtn" class="btn-secondary">Reset <i class="fas fa-redo"></i></button>
        </fieldset>

        <!-- Registered Drug Grid List Section -->
        <fieldset>
            <legend>Registered Drug List</legend>
            
            <!-- Action bar above grid containing the Add Medicine button -->
            <div class="list_action_bar">
                <span class="text-muted">Overview of all registered medicine items in inventory</span>
                <button type="button" id="openAddModalBtn" class="btn-primary-action"><i class="fas fa-plus"></i> Add New Medicine</button>
            </div>

            <!-- Grid card container replacing the original table -->
            <div id="medicineGrid" class="medicine-grid-container">
                <p class="text-center text-muted">Loading inventory...</p>
            </div>
        </fieldset>
    </main>

    <!-- Modal for Add and Edit Medicine -->
    <div id="medModal" class="modal">
        <div class="modal_content">
            <div class="modal_header">
                <h3 id="formTitle">Add New Medicine</h3>
                <button type="button" class="modal_close_x" id="closeMedModalX">&times;</button>
            </div>
            <div class="modal_body">
                <form id="medForm" action="/add-medicine" method="POST">
                    <label for="medicine_id">Medicine ID *</label>
                    <input type="text" id="medicine_id" name="medicine_id" placeholder="e.g. MED-1013" required>

                    <label for="medicine_name">Medicine Name *</label>
                    <input type="text" id="medicine_name" name="medicine_name" placeholder="e.g. Ibuprofen 400mg" required>

                    <label for="addMedicineImage">Medicine Image</label>
                    <input type="file" id="addMedicineImage" name="addMedicineImage" accept="image/*" onchange="previewSelectedImage(event)">
                    <img id="previewImage" src="#" alt="Preview Image" class="preview-image" style="display: none; 
                             width: 80px; height: 80px; object-fit: cover; margin-top: 6px;">
                    
                    <label for="category">Category *</label>
                    <select id="category" name="category" required>
                        <option value="">-- Select Category --</option>
                        <option value="Group B">Group B</option>
                        <option value="Group C">Group C</option>
                        <option value="Group OTC">Group OTC</option>
                    </select>

                    <label for="medicine_type">Medicine Type *</label>
                    <select id="medicine_type" name="medicine_type" required>
                        <option value="">-- Please select category first --</option>
                    </select>

                    <label for="dosage_form">Dosage Form *</label>
                    <select id="dosage_form" name="dosage_form" required>
                        <option value="">-- Select Dosage Form --</option>
                        <option value="Tablet">Tablet</option>
                        <option value="Capsule">Capsule</option>
                        <option value="Chewable Tablet">Chewable Tablet</option>
                    </select>

                    <label for="cost_price">Cost Price (RM) *</label>
                    <input type="number" step="0.01" id="cost_price" name="cost_price" placeholder="0.00" required>

                    <label for="selling_price">Selling Price (RM) *</label>
                    <input type="number" step="0.01" id="selling_price" name="selling_price" placeholder="0.00" required>

                    <label for="minStock">Min Safety Stock *</label>
                    <input type="number" id="minStock" name="minStock" value="50" required>

                    <div class="modal_actions">
                        <button type="button" id="closeMedModalBtn" class="btn-secondary">Cancel ✖</button>
                        <button type="submit" id="submitBtn">Save Medicine ✔</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <hr>
        <p>&copy; 2026 PharmaHub System</p>
    </footer>

</body>
</html>
