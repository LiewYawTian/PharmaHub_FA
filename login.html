<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaHub - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="js/login.js" defer></script>
</head>
<body>

    <!--PharmaHub Logo-->
    <div style="display: flex; justify-content: center; align-items: flex-start;">
        <img src="Logo/PharmaHub.png" alt="PharmaHub Logo" style="display: block; margin-bottom: 30px;">
    </div>

    <header>
        <h1>PharmaHub Inventory System</h1>
        <p>Please enter your credentials to login</p>
    </header>

    <main class="login_container">
        <fieldset>
            <legend>User Login</legend>
            <form id="loginForm">
                <label for="loginUsername">Username:</label>
                <input type="text" id="loginUsername" placeholder="e.g. admin" required>

                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" placeholder="e.g. 123456" required>

                <div id="loginErrorMessage" class="error_message"></div>

                <br>

                <button type="submit" class="login_btn">Login <i class="fas fa-sign-in-alt"></i></button>
            </form>
        </fieldset>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 PharmaHub System</p>
    </footer>

</body>
</html>
